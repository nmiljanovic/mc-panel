{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Bedrock Panel</title>
        <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-light">
        {% load static %}
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container d-flex align-items-center">
                <div class="dropdown me-3">
                    <button class="btn btn-dark"
                            type="button"
                            id="navMenuButton"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            style="padding: 0.25rem 0.5rem">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark"
                        aria-labelledby="navMenuButton">
                        <li>
                            <a class="dropdown-item" href="{% url 'edit_settings' %}">Server Settings</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'manage_assets' %}">Worlds & Mods</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'edit_configs' %}">Allowlist & Ops</a>
                        </li>
                    </ul>
                </div>
                <a class="navbar-brand d-flex align-items-center me-auto"
                   href="{% url 'dashboard' %}">
                    <img src="{% static 'favicon.svg' %}"
                         width="32"
                         height="32"
                         class="d-inline-block align-top me-2">
                    Bedrock Panel
                </a>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <span class="navbar-text me-3 text-light d-none d-sm-inline">
                            <strong>{{ user.username }}</strong>
                        </span>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
