{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Bedrock Panel</title>
        <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .btn {
                padding: 8px 20px;
                border-radius: 8px;
                font-size: 0.75rem;
                font-weight: bold;
                text-transform: uppercase;
                transition: all 0.2s ease;
                border: none;
            }
            .btn-primary {
                background-color: #007bff;
                color: white;
            }
            .card {
                background: #ffffff;
                border: 1px solid #e9ecef;
                border-radius: 12px;
                overflow: hidden;
                transition: box-shadow 0.3s ease;
            }
            .card:hover {
                box-shadow: 0 8px 24px rgba(149, 157, 165, 0.15) !important;
            }
            .card .card-header {
                background-color: #ffffff;
                border-bottom: 1px solid #f1f3f5;
                padding: 1.25rem;
            }
            .card .card-header h5 {
                color: #212529;
                font-weight: 700;
                font-size: 1.1rem;
                display: flex;
                align-items: center;
                text-transform: uppercase;
            }
            .card .card-header h5::before {
                content: "";
                display: inline-block;
                width: 4px;
                height: 18px;
                background-color: #007bff;
                margin-right: 12px;
                border-radius: 10px;
            }
            .card .card-body { 
                padding: 1.5rem;
            }
            .form-label {
                color: #8a8d90;
                font-size: 0.75rem;
                text-transform: uppercase;
                font-weight: bold;
            }
            .alert-info {
                background-color: #e7f3ff;
                border: 1px solid #c2e0ff;
                color: #0056b3;
                border-radius: 10px;
                font-size: 0.75rem;
                font-weight: bold;
                text-transform: uppercase;
                padding: 12px 16px;
            }
            input[type="text"], input[type="password"], input[type="email"], select {
                display: block;
                width: 100%;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.5;
                color: #212529;
                background-color: #fff;
                border: 1px solid #dee2e6;
                border-radius: 8px;
                transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
            }
        </style>
    </head>
    <body class="bg-light">
        {% load static %}
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
                <div class="row w-100 m-0">
                    <div class="col-md-6 d-flex align-items-center justify-content-between p-0">
                        <div class="dropdown me-3">
                            <button class="btn btn-dark"
                                    type="button"
                                    id="navMenuButton"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                    style="padding: 0.25rem 0.5rem">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark"
                                aria-labelledby="navMenuButton">
                                <li>
                                    <a class="dropdown-item" href="{% url 'manage_server' %}">Server Manager</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="{% url 'manage_settings' %}">Server Settings</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="{% url 'manage_assets' %}">Worlds & Mods</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="{% url 'manage_access' %}">Allowlist & Ops</a>
                                </li>
                            </ul>
                        </div>
                        <a class="navbar-brand d-flex align-items-center me-auto"
                           href="{% url 'status' %}">
                            <img src="{% static 'favicon.svg' %}"
                                 width="32"
                                 height="32"
                                 class="d-inline-block align-top me-2">
                            Bedrock Panel
                        </a>
                        <div class="d-flex align-items-center">
                            {% if user.is_authenticated %}
                                <span class="navbar-text me-3 text-light d-none d-sm-inline">
                                    <strong>{{ user.username }}</strong>
                                </span>
                                <form action="{% url 'logout' %}" method="post" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                                </form>
                            {% else %}
                                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
